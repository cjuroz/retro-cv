apiVersion: apps/v1
kind: Deployment
metadata:
  name: retro-cv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retro-cv
  template:
    metadata:
      labels:
        app: retro-cv
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: retro-cv:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
