services:
  web:
    build:
      context: .
    image: ghcr.io/cjuroz/retro-cv:${IMAGE_TAG:-local}
    container_name: retro-cv
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
