<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0d0b">
    <title>{{ .Title }} | Cristian Uroz</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="boot-screen" class="boot-screen">
        <div class="boot-terminal">
            <div class="boot-title">CU SYSTEM BIOS v{{ .Version }}</div>
            <div class="boot-divider"></div>

            <div id="boot-log" class="boot-log"></div>

            <div class="boot-progress">
                <div id="boot-progress-bar"></div>
            </div>

            <div id="boot-complete" class="boot-complete">
                BOOT SUCCESSFUL<span class="boot-cursor">_</span>
            </div>
        </div>
    </div>

    <div class="scanlines" aria-hidden="true"></div>

    <header class="topbar">
        <a class="logo" href="/">CU<span>_</span></a>

        <nav class="navigation" aria-label="Main navigation">
            <a href="/">HOME</a>
            <a href="/about">ABOUT</a>
            <a href="/experience">EXPERIENCE</a>
        </nav>

        <div id="system-status" class="system-status is-loading">
            <span class="status-dot"></span>
            <span class="status-text">SYSTEM LOADING...</span>
        </div>
    </header>

    <main>
        {{ template "content" . }}
    </main>

    <footer>
        <span>CRISTIAN UROZ</span>
        <div class="footer-links">
            <a href="https://github.com/cjuroz/retro-cv" target="_blank" rel="noopener noreferrer">[ VIEW SOURCE ]</a>
            <a href="https://github.com/cjuroz/retro-cv/commit/{{ .Commit }}" target="_blank" rel="noopener noreferrer">COMMIT {{ printf "%.7s" .Commit }} ↗</a>
            <span class="build-info">BUILT WITH GO · v{{ .Version }} · © 2026</span>
        </div>
    </footer>
    
   <script src="/static/js/system-status.js" defer></script>
   <script src="/static/js/boot-screen.js" defer></script>  
   <script src="/static/js/home-terminal.js" defer></script>
</body>
</html>
