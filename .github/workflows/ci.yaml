name: retro-cv

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test Go application
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -cover ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./...

  publish:
    name: Publish Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate application version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Application version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: IMAGE_TAG
          script: |
            cd ~/retro-cv
            git fetch origin
            git reset --hard origin/master

            previous_image=$(docker inspect --format '{{.Config.Image}}' retro-cv 2>/dev/null || true)
            previous_tag="${previous_image##*:}"

            echo "Deploying image tag: $IMAGE_TAG"

            if ! IMAGE_TAG="$IMAGE_TAG" docker compose pull; then
              echo "Image pull failed; existing deployment left unchanged."
              exit 1
            fi

            if ! IMAGE_TAG="$IMAGE_TAG" docker compose up -d; then
              echo "Deployment failed; attempting rollback."
              if [ -n "$previous_tag" ]; then
                IMAGE_TAG="$previous_tag" docker compose pull &&
                IMAGE_TAG="$previous_tag" docker compose up -d
              fi
              exit 1
            fi

            healthy=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Health check failed; attempting rollback."
              if [ -n "$previous_tag" ] && [ "$previous_tag" != "$IMAGE_TAG" ]; then
                IMAGE_TAG="$previous_tag" docker compose pull &&
                IMAGE_TAG="$previous_tag" docker compose up -d
              fi
              exit 1
            fi

            echo "Deployment healthy."
            docker compose ps
